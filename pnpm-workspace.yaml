packages:
  - apps/*
  - packages/*
  - examples/*

# pnpm 11 blocks dependency install scripts by default; allow only the ones we need.
allowBuilds:
  esbuild: true
  '@nestjs/core': false
  '@swc/core': true
  bcrypt: true
  msgpackr-extract: true
  unrs-resolver: true
  '@scarf/scarf': false # telemetry ping from swagger-ui
